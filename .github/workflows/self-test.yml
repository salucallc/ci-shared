# Self-test: run the stack workflows against the fixtures in this repo.
#
# self-validate.yml lints the workflow files; this proves they actually run. It calls them by
# local path, so a PR is tested against its own version of the workflows before any consumer
# pins the new SHA. The repo-docs job runs repo-docs.yml against this repo itself; gate-unit runs the
# merge gate's tests (every check has a fixture that must fail), and merge-gate runs the gate on this repo.

name: Self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-fixture:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      working-directory: fixtures/python-min
  node-fixture:
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      working-directory: fixtures/node-min
  repo-docs:
    uses: ./.github/workflows/repo-docs.yml
  gate-unit:
    name: Merge gate unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${f}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${RUNNER_TEMP}" gitleaks
          echo "GATE_GITLEAKS=${RUNNER_TEMP}/gitleaks" >> "$GITHUB_ENV"
      - name: Install pytest (the mutation fixtures run it)
        run: python -m pip install pytest==9.1.1
      - name: Install bandit and semgrep (the versions pinned in gate/checks/sast.py; the SAST tests run them)
        run: |
          set -euo pipefail
          b="$(python -c "import gate.checks.sast as s; print(s.BANDIT_VERSION)")"
          g="$(python -c "import gate.checks.sast as s; print(s.SEMGREP_VERSION)")"
          python -m pip install "bandit==${b}" "semgrep==${g}"
      - name: Gate tests (every check has a fixture that must fail)
        run: python -m unittest discover -s gate/tests -v
  merge-gate:
    uses: ./.github/workflows/merge-gate.yml
    with:
      # this repo's Python tests are gate-unit above; reusable-python-ci at the root would also
      # collect fixtures/, which the python-fixture job runs in its own directory
      python-ci: skip
