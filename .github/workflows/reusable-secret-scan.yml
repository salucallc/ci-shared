# Reusable: TruffleHog verified-only secret scan.
#
# Derived from salucallc/gmail-mcp .github/workflows/ci.yml (secret-scan job).
# On PR: scan diff between base ref and HEAD (full coverage of introduced
# changes). On push: scan commits since the previous push (github.event.before).

name: Reusable - Secret scan (TruffleHog)

on:
  workflow_call:
    inputs:
      only-verified:
        description: "Pass --only-verified to trufflehog (true recommended to avoid noise)."
        type: boolean
        required: false
        default: true
      scan-path:
        description: "Path within the checkout to scan."
        type: string
        required: false
        default: "./"
      runs-on:
        description: "Runner image."
        type: string
        required: false
        default: ubuntu-24.04

permissions: {}

jobs:
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history on PR (catch leaks introduced and then "fixed" in a
          # later commit); shallow on push.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26  # v3.95.2
        with:
          path: ${{ inputs.scan-path }}
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.event.before }}
          head: HEAD
          extra_args: ${{ inputs.only-verified && '--only-verified' || '' }}
