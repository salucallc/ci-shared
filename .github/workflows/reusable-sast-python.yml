# Reusable: Python SAST (bandit).
#
# Derived from salucallc/gmail-mcp .github/workflows/ci.yml (sast-python job).
# Default severity/confidence thresholds match the gmail-mcp baseline (medium/medium);
# bump to high/high once the backlog is triaged.
#
# Standalone use only. It scans the whole tree and does NOT read .gate-baseline.json. The merge
# gate (merge-gate.yml) runs bandit through gate/checks/sast.py instead, which does. Its version
# and thresholds are held equal to this file's defaults by a test in gate/tests/test_gate.py.

name: Reusable - Python SAST (bandit)

on:
  workflow_call:
    inputs:
      target-paths:
        description: "Space-separated paths or files to scan (passed to bandit -r)."
        type: string
        required: false
        default: "."
      severity-level:
        description: "Minimum severity that fails the job (low|medium|high)."
        type: string
        required: false
        default: medium
      confidence-level:
        description: "Minimum confidence that fails the job (low|medium|high)."
        type: string
        required: false
        default: medium
      bandit-version:
        description: "Pinned bandit version (the same pin as BANDIT_VERSION in gate/checks/sast.py)."
        type: string
        required: false
        default: "1.9.4"
      python-version:
        description: "Python version to set up for bandit."
        type: string
        required: false
        default: "3.12"
      runs-on:
        description: "Runner image."
        type: string
        required: false
        default: ubuntu-24.04

permissions: {}

jobs:
  sast-python:
    name: Python SAST (bandit)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install bandit (pinned)
        env:
          BANDIT_VERSION: ${{ inputs.bandit-version }}
        run: |
          python -m pip install --upgrade pip
          pip install "bandit==${BANDIT_VERSION}"
      - name: Run bandit
        env:
          TARGETS: ${{ inputs.target-paths }}
          SEVERITY: ${{ inputs.severity-level }}
          CONFIDENCE: ${{ inputs.confidence-level }}
        run: |
          # TARGETS is space-separated by contract, so it is split into an array, not quoted whole
          read -r -a targets <<< "$TARGETS"
          bandit -r "${targets[@]}" --severity-level "$SEVERITY" --confidence-level "$CONFIDENCE"
